name: tests

# Runs the suite on every pull request and every push to main, so a change that
# breaks it is visible before it merges. The suite drifted to 109 failures once
# because nothing ran it on merge.
#
# The live-Jena tests (tests/test_get_holon_asof_live.py) skip themselves unless
# HOLONBRIDGE_TEST_FUSEKI_URL is set, so CI reports them as 4 skips. Running
# them here would mean starting a Fuseki service container; not done yet.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the interpreter the suite is run under locally.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # mcp: tests import holonbridge_mcp. shacl: pyshacl is the offline
        # fallback validator. dev: pytest, pytest-asyncio, ruff.
        run: python -m pip install -e ".[mcp,shacl,dev]"

      - name: Test
        run: python -m pytest -q -rf --tb=short
